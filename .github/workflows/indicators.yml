name: Indicators Collect
on:
  schedule:
    - cron: '30 21 * * *'   # 매일 06:30 KST
    - cron: '30 0 * * *'    # 매일 09:30 KST (국제유가 전일값 반영)
    - cron: '30 2 * * *'    # 매일 11:30 KST (환율 당일값 반영)
    - cron: '30 5 * * *'    # 매일 14:30 KST (배출권 전일 거래값 공표 후)
    - cron: '30 8 * * *'    # 매일 17:30 KST (늦게 올라오는 값 보완)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 지표 수집
        env:
          OILPRICE_API_KEY: ${{ secrets.OILPRICE_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KOREAEXIM_KEY: ${{ secrets.KOREAEXIM_KEY }}
        run: python collect_indicators.py
      - name: 변경 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicators.json history
          git diff --staged --quiet || git commit -m "update indicators"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "push 재시도 $i/5"; sleep 5
          done
          exit 1
