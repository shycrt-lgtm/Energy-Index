name: Indicators Collect
on:
  schedule:
    - cron: '30 21 * * *'   # 매일 06:30 KST
    - cron: '30 2 * * *'    # 매일 11:30 KST (환율·배출권 당일값 반영)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 지표 수집
        env:
          OILPRICE_API_KEY: ${{ secrets.OILPRICE_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KOREAEXIM_KEY: ${{ secrets.KOREAEXIM_KEY }}
        run: python collect_indicators.py
      - name: 변경 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indicators.json history
          git diff --staged --quiet || git commit -m "update indicators"
          git push
