name: Opinet Test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 오피넷 국제유가 구조 점검
        run: |
          python3 - <<'PY'
          import re, urllib.request
          u = "https://www.opinet.co.kr/glopcoilSelect.do"
          req = urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0", "Accept-Language": "ko"})
          txt = urllib.request.urlopen(req, timeout=40).read().decode("utf-8", "ignore")
          print("크기", len(txt))
          plain = re.sub(r"\s+", " ", re.sub(r"<script.*?</script>|<style.*?</style>|<[^>]+>", " ", txt, flags=re.S))
          print("[본문 앞부분]", plain[:700])
          for kw in ["Dubai", "두바이", "Brent", "브렌트", "WTI", "국제"]:
              print(f"[{kw}] 위치:", [m.start() for m in re.finditer(kw, txt)][:5])
          print("[form]")
          for m in re.findall(r"<form[^>]*>", txt, flags=re.I)[:6]:
              print("  ", m[:200])
          print("[input 이름]", sorted(set(re.findall(r"<(?:input|select)[^>]*name=[\"']([^\"']+)", txt)))[:40])
          print("[.do 주소들]", sorted(set(re.findall(r"[\"'](/[A-Za-z0-9_/\-]*\.do)[\"']", txt)))[:40])
          print("[ajax/url]")
          for m in re.findall(r"(?:url|action)\s*[:=]\s*[\"']([^\"']+)[\"']", txt)[:30]:
              print("  ", m)
          print("[js 파일]", sorted(set(re.findall(r"src=[\"']([^\"']+\.js[^\"']*)", txt)))[:20])
          PY
