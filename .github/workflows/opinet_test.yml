name: Opinet Test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 오피넷 국제유가 조회 시험
        run: |
          python3 - <<'PY'
          import re, urllib.request, urllib.parse, http.cookiejar, datetime
          base = "https://www.opinet.co.kr"
          cj = http.cookiejar.CookieJar()
          op = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj))
          H = {"User-Agent": "Mozilla/5.0", "Accept-Language": "ko", "Referer": base + "/glopcoilSelect.do"}
          def get(u):
              return op.open(urllib.request.Request(u, headers=H), timeout=40).read().decode("utf-8", "ignore")
          def post(u, data):
              b = urllib.parse.urlencode(data).encode()
              return op.open(urllib.request.Request(u, data=b, headers=H), timeout=40).read().decode("utf-8", "ignore")
          html = get(base + "/glopcoilSelect.do")
          print("[input 태그]")
          inputs = re.findall(r"<input[^>]*>", html, flags=re.I)
          for t in inputs[:45]:
              print("  ", re.sub(r"\s+", " ", t)[:170])
          print("[select 이름/기본값]")
          for m in re.finditer(r"<select[^>]*name=[\"']([^\"']+)[\"'][^>]*>(.*?)</select>", html, flags=re.S|re.I):
              opts = re.findall(r"<option[^>]*value=[\"']([^\"']*)[\"'][^>]*>([^<]*)", m.group(2))
              print("  ", m.group(1), opts[:6], "...", len(opts))
          print("[Dubai 주변 HTML]")
          i = html.find("Dubai")
          print(re.sub(r"\s+", " ", html[max(0, i-500):i+700]))
          # 조회 시도
          today = datetime.date.today()
          s = (today - datetime.timedelta(days=12)).strftime("%Y%m%d"); e = today.strftime("%Y%m%d")
          fields = {}
          for t in inputs:
              n = re.search(r"name=[\"']([^\"']+)", t); v = re.search(r"value=[\"']([^\"']*)", t)
              if n and (n.group(1) not in fields): fields[n.group(1)] = v.group(1) if v else ""
          fields.update({"STDDATE": s, "ENDDATE": e, "SEL_DIV": "D", "TERM": "D",
                         "STA_Y": s[:4], "STA_M": s[4:6], "STA_D": s[6:], "END_Y": e[:4], "END_M": e[4:6], "END_D": e[6:]})
          print("[전송값]", fields)
          for path in ["/glopcoilSelect.do", "/glopcoil_csv.do"]:
              try:
                  r = post(base + path, fields)
                  plain = re.sub(r"\s+", " ", re.sub(r"<script.*?</script>|<style.*?</style>|<[^>]+>", " ", r, flags=re.S))
                  print("==", path, "크기", len(r))
                  k = plain.find("국제원유")
                  print(plain[-900:] if path.endswith("Select.do") else r[:700])
              except Exception as ex:
                  print("==", path, "실패", type(ex).__name__, ex)
          PY
