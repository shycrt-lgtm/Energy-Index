name: REC 3년 데이터 일괄 수집

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3년치 REC 수집 실행
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          python download_rec_3y.py

      - name: build_series 실행 및 결과 커밋
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          python build_series.py
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rec_history.csv series/rec.json series/_status.json
          git diff --staged --quiet || (git commit -m "data: REC 과거 3년치 데이터 구축 반영" && git push)
